server {
    listen 80;
    server_name ton-domaine.com www.ton-domaine.com;

    client_max_body_size 50M;

    location = /favicon.ico {
        access_log off; log_not_found off;
    }

    location /static/ {
        alias /home/django/supermarche/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/django/supermarche/media/;
        expires 7d;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/supermarche_access.log;
    error_log /var/log/nginx/supermarche_error.log;
}

