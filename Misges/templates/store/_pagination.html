{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Page navigation" class="mt-3">
    <ul class="pagination justify-content-center pagination-sm flex-wrap mb-0">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="?{% if query_params %}{{ query_params }}&{% endif %}page={{ page_obj.previous_page_number }}">&laquo;</a>
        </li>
        {% endif %}
        {% for page_num in page_obj.paginator.page_range %}
            <li class="page-item {% if page_num == page_obj.number %}active{% endif %}">
                <a class="page-link" href="?{% if query_params %}{{ query_params }}&{% endif %}page={{ page_num }}">{{ page_num }}</a>
            </li>
        {% endfor %}
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="?{% if query_params %}{{ query_params }}&{% endif %}page={{ page_obj.next_page_number }}">&raquo;</a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
