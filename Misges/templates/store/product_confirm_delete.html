{% extends 'store/base.html' %}
{% block title %}Supprimer le produit - Supermarché{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h4 mb-4">Supprimer le produit</h1>
        <p>Es-tu sûr de vouloir supprimer le produit <strong>{{ product.name }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Supprimer</button>
            <a class="btn btn-secondary ms-2" href="{% url 'store:product_manage' %}">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
